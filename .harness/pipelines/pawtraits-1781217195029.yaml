pipeline:
  name: Build pawtraits
  identifier: Build_pawtraits_1781217201048
  projectIdentifier: default_project
  orgIdentifier: default
  stages:
    - stage:
        name: Build
        identifier: Build
        type: CI
        spec:
          cloneCodebase: true
          execution:
            steps:
              - step:
                  type: Run
                  name: Echo Welcome Message
                  identifier: Echo_Welcome_Message
                  spec:
                    shell: Sh
                    command: echo "Welcome to Harness CI"
              - step:
                  type: BuildAndPushDockerRegistry
                  name: BuildAndPushDockerRegistry_1
                  identifier: BuildAndPushDockerRegistry_1
                  spec:
                    connectorRef: viral
                    repo: viralpatel1994/pawtraits
                    tags:
                      - latest
              - stepGroup:
                  name: sec
                  identifier: sec
                  steps:
                    - parallel:
                        - step:
                            type: Owasp
                            name: Owasp_1
                            identifier: Owasp_1
                            spec:
                              target:
                                detection: auto
                                type: repository
                              advanced:
                                log:
                                  level: info
                                args: {}
                              mode: orchestration
                              config: default
                        - step:
                            type: Gitleaks
                            name: Gitleaks_1
                            identifier: Gitleaks_1
                            spec:
                              target:
                                detection: auto
                                type: repository
                              advanced:
                                log:
                                  level: info
                                args: {}
                              mode: orchestration
                              config: default
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
        description: ""
    - stage:
        name: mini kube deploy
        identifier: mini_kube_deploy
        description: ""
        type: Deployment
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: paw
          environment:
            environmentRef: viralstg
            deployToAll: false
            infrastructureDefinitions:
              - identifier: infra
          execution:
            steps:
              - step:
                  name: Rollout Deployment
                  identifier: rolloutDeployment
                  type: K8sRollingDeploy
                  timeout: 10m
                  spec:
                    skipDryRun: false
                    pruningEnabled: false
            rollbackSteps:
              - step:
                  name: Rollback Rollout Deployment
                  identifier: rollbackRolloutDeployment
                  type: K8sRollingRollback
                  timeout: 10m
                  spec:
                    pruningEnabled: false
        tags: {}
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
  properties:
    ci:
      codebase:
        connectorRef: harnessgitconnector
        repoName: pawtraits
        build: <+input>
